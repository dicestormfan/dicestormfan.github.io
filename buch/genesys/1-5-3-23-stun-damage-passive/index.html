<h1>Stun Damage (Passive)</h1>
<p>A weapon with this quality can only deal strain damage (damage applied to the target's strain threshold). Because this is strain <em>damage,</em> not strain, it is still reduced by a target's soak.</p>
<h2>Sources</h2>
