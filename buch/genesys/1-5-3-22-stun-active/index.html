<h1>Stun (Active)</h1>
<p>A weapon with Stun can deal strain to the target. When the Stun quality is activated, it inflicts strain equal to the weapon's Stun rating. Since this is strain, and not strain <em>damage,</em> it is not reduced by the target's soak.</p>
<h2>Sources</h2>
<ul>
<li>Genesys Core Rules, p. 88</li>
